version: "3.9"

# Sprint 1: solo el backend del agente
# Sprint 4: agregar servicio de PostgreSQL
# Sprint 5: agregar servicio de Streamlit frontend

services:
  # ── Backend FastAPI ────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Ollama corre en el host, no en Docker
      # En Linux: host.docker.internal puede no funcionar, usar la IP del host
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"  # necesario en Linux
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

